services:
  db:
    image: ghcr.io/ai-kids-care-team/ai-kids-care/db:prod
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: ai-kids-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kids_postgres_db}
      POSTGRES_USER: ${POSTGRES_USER:-kids_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-kids_user} -d ${POSTGRES_DB:-kids_postgres_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  neo4j:
    image: neo4j:5.19
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      TZ: Asia/Seoul
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt (Java Driver)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ai-kids-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Python Data Loader
  data-loader:
    image: ghcr.io/ai-kids-care-team/ai-kids-care/data-loader:prod
    build:
      context: ./db/ne4j_kindergartens
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-kids_postgres_db}
      DB_USER: ${POSTGRES_USER:-kids_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # 增量 sync 轮询参数（长生命周期 loader）
      POLL_INTERVAL_SEC: ${GRAPH_SYNC_POLL_INTERVAL_SEC:-30}
      RECONCILE_EVERY: ${GRAPH_SYNC_RECONCILE_EVERY:-1}
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # 长生命周期增量 sync（ADR: neo4j-incremental-sync）：从 one-shot 跑完即退改为常驻
    # 进程持续把 PG 增量 upsert 进 Neo4j。unless-stopped 保证崩溃/重启后恢复轮询。
    restart: unless-stopped

  # D-STORE: object storage for detection-event evidence (images/clips). Backend reverse-proxies
  # content reads (GET /api/v1/event_evidence_files/{id}/content) — MinIO itself is never exposed to
  # the browser; the 9000/9001 host port mappings below are dev/demo convenience only (see
  # docker-compose.prod.yml, which resets them, mirroring db/neo4j/redis).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ai-kids-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      TZ: Asia/Seoul
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot idempotent bucket bootstrap (tasks.md "bucket 幂等初始化"). `mc mb --ignore-existing`
  # is a no-op on a bucket that already exists, so re-running `docker compose up` never errors here.
  # `restart: "no"` — this container is meant to exit 0 and stay stopped, not to be a long-lived service.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ai-kids-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-kids-care}
    volumes:
      # Demo-only evidence sample: a real JPEG mounted read-only so the demo stack renders an actual
      # frame at the seed row's storage_uri (s3://ai-kids-care/evidence/seed-event-001.jpg, see
      # db/initdb/44_event_evidence_files_seed.sql) → list available=true → content endpoint streams
      # bytes → <img> shows a picture. Reuses an existing repo image (arbitrary stand-in). The
      # prod/cd overlays !reset this (seed-free, mirroring Dockerfile.prod); real evidence frames
      # arrive later via live-flow (file://→s3://) per the change's Non-goals.
      - ./frontend/public/home/slide-1.jpg:/seed/seed-event-001.jpg:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\" &&
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\" &&
      { mc cp /seed/seed-event-001.jpg local/\"$$MINIO_BUCKET\"/evidence/seed-event-001.jpg || true; }
      "
    restart: "no"

  backend:
    image: ghcr.io/ai-kids-care-team/ai-kids-care/backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-kids_postgres_db}
      DB_USER: ${POSTGRES_USER:-kids_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RRN_HASH_PEPPER: ${RRN_HASH_PEPPER:?RRN_HASH_PEPPER must be set}
      CAMERA_STREAM_AES_KEY_V1: ${CAMERA_STREAM_AES_KEY_V1:?CAMERA_STREAM_AES_KEY_V1 must be set}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN must be set}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-kids-care}
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: ghcr.io/ai-kids-care-team/ai-kids-care/frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
