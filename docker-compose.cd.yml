# CD / Registry deploy override  (ADR-0022)
#
# Usage (演示机):
#   docker compose -f docker-compose.yml -f docker-compose.cd.yml up -d
#
# 这个 override 的作用：
#   1. 清除 base compose 中 db/data-loader/backend/frontend 的 build 指令，
#      强制 Docker Engine 直接拉取 GHCR 镜像（host 不构建）。
#      image: 键已在 base docker-compose.yml 中声明，故此处无需重复。
#   2. 新增 watchtower 服务，轮询 :prod 镜像 digest 变化后自动 pull + 重建容器。
#
# ─── 演示数据策略（OQ-1 已定：持久）──────────────────────────────────────────
#   db 使用 GHCR 的 db:prod（含 initdb 种子），首次启动灌种子一次；
#   之后持久卷（postgres_data）保留数据，Flyway 管理 schema 增量。
#   watchtower 重建容器时不清卷，演示数据持续存在。
#   若需强制重灌种子，手动执行：
#     docker compose -f docker-compose.yml -f docker-compose.cd.yml down -v
#     docker compose -f docker-compose.yml -f docker-compose.cd.yml up -d
#
# ─── host 侧前置条件（维护者操作一次）────────────────────────────────────────
#   1. 在 host 上用 GHCR PAT（read:packages scope）登录：
#        docker login ghcr.io -u <github-username> --password-stdin
#      登录态保存在 ~/.docker/config.json；watchtower 挂载此文件自动复用。
#   2. watchtower 环境变量 WATCHTOWER_POLL_INTERVAL=300 表示每 5 分钟检查一次。
#      按需调整。参见 OQ-2（token 轮换方式待定）。
#
# ─── 不动 docker-compose.prod.yml ─────────────────────────────────────────────
#   真 prod（Caddy TLS + Dockerfile.prod 无种子 + secure cookie）仍用：
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   本文件与 prod override 相互独立，不混用。

services:
  db:
    build: !reset null    # 清除 base 的 build 指令；image: 键继承自 base

  data-loader:
    build: !reset null

  backend:
    build: !reset null

  frontend:
    build: !reset null

  # ── watchtower：自动拉取并重建 :prod digest 变化的服务容器 ─────────────────
  # 认证（路 A，Windows 友好）：用 REPO_USER/REPO_PASS，从演示机的 .env 注入
  #   （GHCR_USER=GitHub 用户名、GHCR_PAT=read:packages PAT）。.env 已被 .gitignore
  #   忽略，不入库。这样避开 Windows Docker Desktop 把凭据存进 credsStore（而非明文
  #   config.json）、导致挂载 config.json 拿不到凭据的坑。见 .env.example。
  # 监控范围：WATCHTOWER_LABEL_ENABLE=false = 监控同 Docker 守护进程下全部容器。
  #   若只想监控本栈，改 "true" 并在各服务 labels 下加
  #   com.centurylinklabs.watchtower.enable=true。
  watchtower:
    image: containrrr/watchtower
    container_name: ai-kids-watchtower
    restart: unless-stopped
    volumes:
      # Docker socket：watchtower 用它拉取镜像并重建容器
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 轮询间隔（秒）。300 = 每 5 分钟检查一次 :prod digest。
      WATCHTOWER_POLL_INTERVAL: "300"
      # 拉取新镜像后删除旧镜像，避免磁盘堆积
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "false"
      # GHCR 私有镜像拉取凭据（从演示机 .env 注入；见 .env.example）
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_PAT:-}
      # containrrr/watchtower 的内置 Docker API client 默认协商版本过旧（1.25），
      # 新 Docker daemon（Docker Desktop/Engine 较新版）最低要求 API 1.40，会拒绝并报
      # "client version 1.25 is too old"。强制用 1.41（≥1.40 且广泛支持）即可。
      DOCKER_API_VERSION: "1.41"
