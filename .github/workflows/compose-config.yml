name: Compose Config

# Validates that the demo, CD registry, and merged production compose files resolve
# (SPEC-0001 / ADR-0022 release-gate check). This only checks structure — it does
# not start containers, issue TLS certificates, or bind host ports.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # These are required (fail-fast) variables in the compose files (no weak
    # defaults, per SPEC-0001 N-1). This job only validates structure, so dummy
    # values are sufficient and intentionally non-secret.
    env:
      POSTGRES_PASSWORD: ci-structure-check
      NEO4J_PASSWORD: ci-structure-check
      REDIS_PASSWORD: ci-structure-check
      RRN_HASH_PEPPER: ci-structure-check
      CAMERA_STREAM_AES_KEY_V1: ci-structure-check
      AI_SERVICE_TOKEN: ci-structure-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate base (demo) compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate CD registry compose (ADR-0022)
        run: docker compose -f docker-compose.yml -f docker-compose.cd.yml config -q

      - name: Validate merged production compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
