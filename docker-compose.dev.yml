# docker-compose.dev.yml —— 本地调试 overlay（dev-only，非部署面）
#
# 目的：让本地拉起完整栈用【本地构建的镜像】，绝不 pull GHCR，且【无需手动 --build】。
# 根 docker-compose.yml 的 db/data-loader/backend/frontend 同时声明了
# `image: ghcr…:prod` + `build:`，普通 `up` 会先去 GHCR pull `:prod` → 未登录/未发布即 `denied`。
# 本 overlay 把这四个服务的镜像改成本地 `:dev` tag，并设 `pull_policy: build`：
# **`docker compose up` 时，缺失的 :dev 镜像会自动本地构建（不带 --build 也构建）、绝不 pull**。
#
# 用法（不用记 --build）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#     ↑ 缺镜像自动构建；代码改动也会自动 pick up。
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f backend
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down
# 需要 .env（已存在，含 POSTGRES_PASSWORD 等；neo4j/redis 用公共镜像照常 pull）。
#
# 行为说明（`pull_policy: build`，实测 v5.1.4）：
#   - `docker compose up` 会在缺镜像时自动本地构建、绝不 pull GHCR —— 这正是"不用手动 --build"。
#   - 代价：**每次 `up` 都会重建**（层缓存下通常几秒）并因 buildx 新 digest 触发容器 recreate。
#     数据无损（postgres_data 等卷持久），只是每次 up 容器会重建。可接受的 dev 权衡。
#   - 若嫌每次重建/recreate 烦，把本文件四处 `pull_policy: build` 改成 `never`：
#     则 `up` 只在镜像已在时直接起（不重建、不 recreate、最快），但**清过镜像/首次**需
#     手动 `up -d --build` 一次。二选一按口味。
#
# ⚠️ IDE（JetBrains 等）注意：自动构建只在 `docker compose up` 下生效。若 IDE 的 runner 跑的是
# `create` 或带 no-build（你之前报 "No such image …:dev" 就是这情况），在 run 配置勾 "--build"，
# 或直接用终端 `up`。
#
# 附带调试便利：
#   - backend 开 JDWP 远程调试口 5005（IDE 连 localhost:5005，suspend=n 不阻塞启动）。
#   - SESSION_COOKIE_SECURE=false，确保会话 cookie 在 http://localhost 下可用。
# 想要应用 DEBUG 日志：在 backend/src/main/resources/application.yml 加
#   logging.level.com.ai_kids_care.v1: DEBUG
# （包名含下划线，用环境变量映射该 logger 不可靠，故不在此 overlay 设）。
#
# 前端是静态导出（nginx 托管构建产物），本 overlay 不做前端热重载——改前端后
# 重跑 `up -d --build frontend` 即可（或本机 `cd frontend && npm run dev` 单独调）。

services:
  db:
    image: ai-kids-care/db:dev
    pull_policy: build

  data-loader:
    image: ai-kids-care/data-loader:dev
    pull_policy: build

  backend:
    image: ai-kids-care/backend:dev
    pull_policy: build
    environment:
      # 追加 JDWP（保留 base 的时区设置；overlay 的同名 env 整体替换该键，故需带上原值）
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=Asia/Seoul
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # http://localhost 下会话 cookie 不加 Secure（base 未设，显式声明避免踩坑）
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "5005:5005"   # JDWP 远程调试

  frontend:
    image: ai-kids-care/frontend:dev
    pull_policy: build
    # 前端宿主端口，默认 80（浏览器直接 http://localhost）。想换端口设 FRONTEND_PORT 即可。
    # base docker-compose.yml 本就是 80:80，dev 不写也会继承；这里显式声明便于在 dev 文件里查看/控制。
    # 用 !override 替换 base 的 ports（compose 对 ports 默认是拼接，不 override 会变成两条重复的 80:80）。
    ports: !override
      - "${FRONTEND_PORT:-80}:80"
